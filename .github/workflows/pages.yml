# Этот файл работает, когда school-twin выносится в отдельный репозиторий
# (GitHub Pages). Пока проект лежит внутри репозитория отдела,
# сборка проверяется локально: npm run build.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Сборка
        run: node tools/build-dist.mjs
      - name: Проверка данных перед публикацией
        run: node tools/check-public-data.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
